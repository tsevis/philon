name: Package Philon

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Path filters are deliberately absent: a tag means package this commit, and
# GitHub does not evaluate path filters for tag pushes in any case. Packaging
# is not cancelled when superseded, because a tag names one specific artefact.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # HOSTED, FOR THE REASON verify.yml ALREADY RECORDS. This repository is
    # public, and the fleet refuses a public repository a runner on the
    # owner's Mac -- a fork's pull request would run its author's code there.
    # So this label was one no runner would ever answer, and it kept the
    # repository on a managed list it could never be served from: three
    # containers crash-looped 580 times overnight because of entries like it.
    #
    # Free, and measured rather than assumed. 2026-09-16, philon's own first
    # hosted run, `/actions/runs/35092479590/timing`:
    #
    #   {"MACOS":{"jobs":1,"total_ms":0},"UBUNTU":{"jobs":1,"total_ms":0}}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      # `actions/setup-python` again. It hardcodes
      # /Users/runner/hostedtoolcache on macOS, a path that does not exist on
      # a self-hosted Mac and cannot be created without root -- and that IS
      # the tool cache on a hosted one. The `uv` dance was the workaround for
      # the machine this job no longer runs on.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # scripts/package-engine.sh and the test:engine script both use
      # .venv/bin/python, so CI builds the same environment a developer has
      # rather than a system one the scripts cannot see.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --requirement engine/requirements-build.txt
      - run: npm run license:check
      - run: npm run sbom:check
      - run: npm run local-only:check
      - run: npm run test:ui
      - run: npm run tauri:package
      - run: PHILON_VISION_INTEGRATION=1 npm run test:engine
      - uses: actions/upload-artifact@v7
        with:
          name: Philon-adhoc-signed-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg

# A notarized release needs an Apple Developer certificate, keychain setup,
# Apple ID/app-specific password, and notary profile supplied by the owner.
# This workflow intentionally produces an ad-hoc signed, un-notarized artefact
# until those secrets are configured in a separate protected release environment.
# Ad-hoc sealing is what lets `codesign --verify` pass on the bundle; it carries
# no Developer ID and Gatekeeper still refuses it on another machine.
