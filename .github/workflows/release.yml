name: Package Philon

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # scripts/package-engine.sh and the test:engine script both use
      # .venv/bin/python, so CI builds the same environment a developer has
      # rather than a system one the scripts cannot see.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --requirement engine/requirements-build.txt
      - run: npm run license:check
      - run: npm run sbom:check
      - run: npm run local-only:check
      - run: npm run test:ui
      - run: npm run tauri:package
      - run: PHILON_VISION_INTEGRATION=1 npm run test:engine
      - uses: actions/upload-artifact@v4
        with:
          name: Philon-unsigned-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg

# A notarized release needs an Apple Developer certificate, keychain setup,
# Apple ID/app-specific password, and notary profile supplied by the owner.
# This workflow intentionally produces an unsigned artefact until those secrets
# are configured in a separate protected release environment.
