name: Verify Philon

on:
  # Branches only. A bare `push` also fires on tag pushes, so cutting a release
  # ran this workflow twice against the same commit: once for main, once for
  # the tag that points at it.
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"
  # Spelled out twice rather than shared through a YAML anchor: GitHub's
  # workflow parser does not support anchors.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"

# A macos-15 minute is billed at ten times the clock on a private repository,
# so a superseded run is worth cancelling rather than finishing.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # actions/setup-python hardcodes /Users/runner/hostedtoolcache on macOS
      # (the IS_MAC branch of its run()), overwriting RUNNER_TOOL_CACHE. That
      # path does not exist on a self-hosted Mac and cannot be created without
      # root. uv supplies the same interpreter; --seed gives a writable venv so
      # `pip install` is not refused by PEP 668.
      - name: Set up Python 3.10 (self-hosted macOS)
        run: |
          uv python install "3.10"
          uv venv --seed --python "3.10" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # scripts/package-engine.sh and the test:engine script both use
      # .venv/bin/python, so CI builds the same environment a developer has
      # rather than a system one the scripts cannot see.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --requirement engine/requirements-build.txt
      - run: npm run license:check
      - run: npm run sbom:check
      - run: npm run local-only:check
      - run: npm run test:ui
      - run: npm run build
      - run: npm run engine:package
      - run: PHILON_VISION_INTEGRATION=1 npm run test:engine
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  # Everything above needs a Mac: the Apple Vision helper, the Tauri build, the
  # packaged bundle. Everything below does not, and Linux minutes bill at 1x
  # where macOS bills at 10x -- so the gates and the engine run here as well,
  # and keep running when the macOS job is the expensive thing to spend on.
  #
  # This job also carries the one check the macOS job cannot: parity against
  # the port, which needs both repositories checked out at once.
  engine-and-policy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          path: philon

      # A missing or expired token fails the checkout below with an error that
      # names neither the secret nor the fix. Say it here instead, before the
      # confusing one happens.
      #
      # There are two tokens, one per repository, each scoped to read ONLY its
      # peer -- so this repository's token can read tsevis/philon-python and cannot read
      # tsevis/philon. Neither token needs to read the repository holding it.
      - name: Check the peer-repository token is present
        env:
          PEER_TOKEN: ${{ secrets.PHILON_PEER_TOKEN }}
        run: |
          if [ -z "${PEER_TOKEN}" ]; then
            echo "::error::PHILON_PEER_TOKEN is not set on tsevis/philon. The parity gate has to check out tsevis/philon-python, which is private and which the built-in GITHUB_TOKEN cannot read. Create a fine-grained PAT scoped to tsevis/philon-python only, with Contents: Read-only, and add it as PHILON_PEER_TOKEN here."
            exit 1
          fi

      # The port, so the parity gate has something to compare against.
      - name: Check out the port
        id: peer
        uses: actions/checkout@v7
        with:
          repository: tsevis/philon-python
          token: ${{ secrets.PHILON_PEER_TOKEN }}
          path: philon_p

      # The likely misconfiguration, once there are two tokens: they get crossed.
      # A token scoped to the wrong repository fails as "Repository not found",
      # which reads like the repository is missing rather than the scope wrong.
      - name: Explain a failed peer checkout
        if: failure() && steps.peer.outcome == 'failure'
        env:
          PEER_TOKEN: ${{ secrets.PHILON_PEER_TOKEN }}
        run: |
          # Ask the API which failure this is rather than naming a likely
          # cause. This step cannot see the checkout's own error, and the two
          # failures need opposite fixes: an expired token is replaced, a
          # mis-scoped one is re-scoped. Guessing cost real time on
          # 2026-09-05, when both tokens had expired and this message sent
          # the reader looking at scope.
          #
          # 401 is unambiguous. 404 is GitHub refusing to confirm a private
          # repository exists to a token that cannot read it, so it covers
          # both "wrong repository" and "no access to the right one".
          # Only the status code is printed; the token is never echoed.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer ${PEER_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/tsevis/philon-python")
          case "$code" in
            401)
              echo "::error::PHILON_PEER_TOKEN on tsevis/philon is expired or revoked — the API answered 401 Bad credentials, so its scope was never even considered. Create a new fine-grained PAT scoped to tsevis/philon-python with Contents: Read-only, then: gh secret set PHILON_PEER_TOKEN --repo tsevis/philon"
              ;;
            404)
              echo "::error::PHILON_PEER_TOKEN on tsevis/philon cannot read tsevis/philon-python — the API answered 404, which for a private repository means the token is valid but scoped elsewhere. It must be scoped to tsevis/philon-python, the PEER, not to tsevis/philon."
              ;;
            200)
              echo "::error::PHILON_PEER_TOKEN on tsevis/philon can read tsevis/philon-python — the API answered 200, so the token is fine and the checkout failed for another reason. Read the checkout step's own log above."
              ;;
            *)
              echo "::error::Could not check out tsevis/philon-python, and probing the API for it returned $code. Neither an expired token (401) nor a scope problem (404); read the checkout step's own log above."
              ;;
          esac
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: philon/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - working-directory: philon
        run: npm ci
      - working-directory: philon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --requirement engine/requirements.txt

      - name: Policy gates
        working-directory: philon
        run: |
          npm run license:check
          npm run sbom:check
          npm run local-only:check
          npm run model-fetch:check

      - working-directory: philon
        run: npm run test:ui
      - working-directory: philon
        run: npm run build

      # Without PHILON_VISION_INTEGRATION the two Apple Vision tests skip, which
      # is the honest result on a Linux runner. The macOS job runs them for real.
      - name: Engine and benchmark suites
        working-directory: philon
        run: npm run test:engine

      # Skipping is a failure here: a parity gate that passes without a peer to
      # compare against is indistinguishable from one that compared and was
      # satisfied.
      - name: Engine parity against the port
        working-directory: philon
        env:
          PHILON_PARITY_PEER: ${{ github.workspace }}/philon_p
          PHILON_PARITY_REQUIRE: "1"
        run: npm run parity:check
