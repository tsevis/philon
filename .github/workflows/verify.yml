name: Verify Philon

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # scripts/package-engine.sh and the test:engine script both use
      # .venv/bin/python, so CI builds the same environment a developer has
      # rather than a system one the scripts cannot see.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --requirement engine/requirements-build.txt
      - run: npm run license:check
      - run: npm run sbom:check
      - run: npm run local-only:check
      - run: npm run test:ui
      - run: npm run build
      - run: npm run engine:package
      - run: PHILON_VISION_INTEGRATION=1 npm run test:engine
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
