name: Verify Philon

on:
  # Branches only. A bare `push` also fires on tag pushes, so cutting a release
  # ran this workflow twice against the same commit: once for main, once for
  # the tag that points at it.
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"
  # Spelled out twice rather than shared through a YAML anchor: GitHub's
  # workflow parser does not support anchors.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"

# A macos-15 minute is billed at ten times the clock on a private repository,
# so a superseded run is worth cancelling rather than finishing.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # STILL SELF-HOSTED, AND STILL QUEUED, AND THAT IS A DECISION NOT YET MADE.
    #
    # This job genuinely needs a Mac -- the Apple Vision helper, the Tauri
    # build, the packaged bundle -- so it cannot follow `engine-and-policy`
    # onto `ubuntu-latest`. And it cannot get a self-hosted one either, for
    # the reason written there: this repository is public.
    #
    # `macos-latest` would run it. Whether that is free here could not be
    # measured: the billing endpoint needs a scope this token does not carry,
    # GitHub's own page says standard hosted runners are free in public
    # repositories AND that larger runners are always charged even there, and
    # the comment below this block records macOS billing at 10x on a BILLED
    # account. Two readings, no measurement, so no change.
    #
    # Until somebody decides -- hosted macOS, or make this repository private
    # again -- this job stays queued and this workflow cannot be fully green.
    # Said here rather than discovered from a pending check.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # actions/setup-python hardcodes /Users/runner/hostedtoolcache on macOS
      # (the IS_MAC branch of its run()), overwriting RUNNER_TOOL_CACHE. That
      # path does not exist on a self-hosted Mac and cannot be created without
      # root. uv supplies the same interpreter; --seed gives a writable venv so
      # `pip install` is not refused by PEP 668.
      - name: Set up Python 3.10 (self-hosted macOS)
        run: |
          uv python install "3.10"
          uv venv --seed --python "3.10" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # scripts/package-engine.sh and the test:engine script both use
      # .venv/bin/python, so CI builds the same environment a developer has
      # rather than a system one the scripts cannot see.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --requirement engine/requirements-build.txt
      - run: npm run license:check
      - run: npm run sbom:check
      - run: npm run local-only:check
      - run: npm run test:ui
      - run: npm run build
      - run: npm run engine:package
      - run: PHILON_VISION_INTEGRATION=1 npm run test:engine
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  # Everything above needs a Mac: the Apple Vision helper, the Tauri build, the
  # packaged bundle. Everything below does not, and Linux minutes bill at 1x
  # where macOS bills at 10x -- so the gates and the engine run here as well,
  # and keep running when the macOS job is the expensive thing to spend on.
  #
  # This job also carries the one check the macOS job cannot: parity against
  # the port, which needs both repositories checked out at once.
  engine-and-policy:
    # HOSTED, BECAUSE THIS REPOSITORY IS PUBLIC AND THE FLEET REFUSES IT.
    #
    # `tsevisrunner status`, 2026-09-16:
    #
    #   PUBLIC — NO RUNNER WILL BE STARTED
    #     philon  it went public while managed; nothing will be started for it
    #
    # That refusal is right and is not a preference: on a public repository a
    # `pull_request` workflow runs the author's code, anyone can be the author,
    # and it would run on that Mac as its owner, with its SSH keys and its `gh`
    # credentials. So `[self-hosted, linux]` was asking for a runner that could
    # never arrive -- two runs queued from 2026-09-16T03:42Z with nothing
    # counting, because `timeout-minutes` only starts once a job is picked up.
    #
    # Free, and that is the half of the sentence below that public changes:
    # standard GitHub-hosted runners cost nothing in a public repository. The
    # 1x/10x note under this comment is about a BILLED account; it still
    # decides which job goes where, and it is why `verify` above has not moved.
    #
    # Nothing here needs the machine: checkout, setup-node, setup-python,
    # `npm ci`, a venv, the policy scripts and the engine suite. The one step
    # that needs the peer checkout already does not run on a pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: philon

      # A missing key fails the checkout below with an error that names neither
      # the secret nor the fix. Say it here instead, before the confusing one.
      #
      # There are two deploy keys, one per repository, each installed read-only
      # on its PEER -- so this repository holds the private half of the key that
      # tsevis/philon uses to read tsevis/philon-python. A deploy key is
      # accepted by exactly one repository on GitHub, which is what makes the
      # crossed-keys mistake below detectable.
      - name: Check the peer-repository key is present
        # NOT ON A PULL REQUEST. Reading the port needs a peer credential,
        # and a credential that expires is a credential that WILL expire: the
        # mirror of this gate on tsevis/philon-python took 15 of its last 17
        # runs red with 401 Bad credentials, none of them about code. A pull
        # request must be able to go green on what it changed; the parity
        # question is still asked on push and on the nightly.
        if: github.event_name != 'pull_request'
        env:
          PEER_KEY: ${{ secrets.PHILON_PEER_SSH_KEY }}
        run: |
          if [ -z "${PEER_KEY}" ]; then
            echo "::error::PHILON_PEER_SSH_KEY is not set on tsevis/philon. The parity gate has to check out tsevis/philon-python, which is private and which the built-in GITHUB_TOKEN cannot read. Generate a keypair, add the PUBLIC half to tsevis/philon-python as a read-only deploy key, and add the PRIVATE half here as PHILON_PEER_SSH_KEY."
            exit 1
          fi

      # The port, so the parity gate has something to compare against.
      # ssh-key rather than token: a deploy key does not expire, which is the
      # failure this replaces -- both PATs lapsed on 2026-09-05 and again on
      # 2026-09-06, costing two red builds that had nothing to do with the code.
      - name: Check out the port
        if: github.event_name != 'pull_request'
        id: peer
        uses: actions/checkout@v7
        with:
          repository: tsevis/philon-python
          ssh-key: ${{ secrets.PHILON_PEER_SSH_KEY }}
          path: philon_p

      # The likely misconfiguration, once there are two keys: they get crossed.
      # A key installed on the wrong repository fails as "Repository not found",
      # which reads like the repository is missing rather than the key misplaced.
      - name: Explain a failed peer checkout
        if: failure() && steps.peer.outcome == 'failure'
          && github.event_name != 'pull_request'
        env:
          PEER_KEY: ${{ secrets.PHILON_PEER_SSH_KEY }}
        run: |
          # Ask GitHub over SSH which failure this is rather than naming a
          # likely cause. This step cannot see the checkout's own error, and
          # the two failures need opposite fixes: an unrecognised key is
          # replaced, a misplaced one is moved to the right repository.
          #
          # GitHub's SSH endpoint separates them cleanly:
          #   "Permission denied (publickey)" -> the key is not installed anywhere
          #   "Repository not found"          -> the key is valid, but on another repo
          # The key is written 0600 to a private temp dir and removed after;
          # it is never echoed, and ls-remote prints only refs.
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "${PEER_KEY}" > "$keydir/id"
          chmod 600 "$keydir/id"

          out=$(GIT_SSH_COMMAND="ssh -i $keydir/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
                git ls-remote git@github.com:tsevis/philon-python.git 2>&1) && status=0 || status=$?

          if [ "$status" -eq 0 ]; then
            echo "::error::PHILON_PEER_SSH_KEY on tsevis/philon can read tsevis/philon-python — ls-remote succeeded, so the key is fine and the checkout failed for another reason. Read the checkout step's own log above."
          elif printf '%s' "$out" | grep -qi 'permission denied'; then
            echo "::error::PHILON_PEER_SSH_KEY on tsevis/philon is not recognised by GitHub — SSH answered 'Permission denied (publickey)', so it was never matched to a repository. Add the PUBLIC half of this keypair to tsevis/philon-python as a read-only deploy key, or regenerate the pair and set both halves."
          elif printf '%s' "$out" | grep -qi 'repository not found'; then
            echo "::error::PHILON_PEER_SSH_KEY on tsevis/philon cannot read tsevis/philon-python — SSH answered 'Repository not found', which for a valid key means it is installed on the wrong repository. The public half must be a deploy key on tsevis/philon-python, the PEER, not on tsevis/philon."
          else
            echo "::error::Could not check out tsevis/philon-python, and probing it over SSH failed for another reason. Neither an unrecognised key nor a misplaced one; read the checkout step's own log above."
          fi
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: philon/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - working-directory: philon
        run: npm ci
      - working-directory: philon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --requirement engine/requirements.txt

      - name: Policy gates
        working-directory: philon
        run: |
          npm run license:check
          npm run sbom:check
          npm run local-only:check
          npm run model-fetch:check

      - working-directory: philon
        run: npm run test:ui
      - working-directory: philon
        run: npm run build

      # Without PHILON_VISION_INTEGRATION the two Apple Vision tests skip, which
      # is the honest result on a Linux runner. The macOS job runs them for real.
      - name: Engine and benchmark suites
        working-directory: philon
        run: npm run test:engine

      # Skipping is a failure here: a parity gate that passes without a peer to
      # compare against is indistinguishable from one that compared and was
      # satisfied.
      - name: Engine parity against the port
        if: github.event_name != 'pull_request'
        working-directory: philon
        env:
          PHILON_PARITY_PEER: ${{ github.workspace }}/philon_p
          PHILON_PARITY_REQUIRE: "1"
        run: npm run parity:check
